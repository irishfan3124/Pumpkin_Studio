name: Build Pumpkin Studio iOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pumpkin-studio/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pumpkin-studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pumpkin-studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run ios:sync
      - name: Build an unsigned simulator app
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package the simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios-simulator/Build/Products/Release-iphonesimulator/App.app build/PumpkinStudio-simulator.zip
      - name: Build an unsigned iPhone app for personal signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/PumpkinStudio-unsigned.xcarchive \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Package an unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          ditto build/PumpkinStudio-unsigned.xcarchive/Products/Applications/App.app build/ipa/Payload/PumpkinStudio.app
          cd build/ipa
          zip -qry ../PumpkinStudio-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: Pumpkin-Studio-iOS-test-builds
          path: |
            pumpkin-studio/build/PumpkinStudio-simulator.zip
            pumpkin-studio/build/PumpkinStudio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
